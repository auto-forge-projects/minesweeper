# deploy.json.port=3000 ile eşleşir; healthcheck=/health remote-deploy.sh tarafından çağrılır.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
